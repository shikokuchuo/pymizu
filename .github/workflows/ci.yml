name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm reads the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tools
        # ruff pinned to match the dev extra and .pre-commit-config.yaml —
        # bump all three together.
        run: pip install ruff==0.14.0 pyrefly numpy cloudpickle pyarrow polars
      - name: Ruff
        run: ruff check python tests benchmarks
      - name: Ruff format
        run: ruff format --check python tests benchmarks
      - name: Pyrefly
        run: pyrefly check

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm reads the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The sdist must carry the vendored C core and build standalone.
      - name: Build sdist and wheel from it
        run: |
          pip install build
          python -m build --sdist
          pip wheel --no-deps dist/*.tar.gz

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: ubuntu-latest, python-version: "3.15" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.15" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.15" }
    runs-on: ${{ matrix.os }}
    env:
      CROSSLANG_PAT: ${{ secrets.CROSSLANG_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm reads the version from tags

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # setup.py forces clang-cl on Windows (MSVC C11 atomics unsupported);
      # LLVM is preinstalled on the runners but not on PATH.
      - name: Add LLVM to PATH
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Build and install
        # tzdata: the IANA database zoneinfo falls back to (Windows runners
        # have no system database).
        run: pip install . pytest numpy pyarrow polars cloudpickle coverage tzdata

      # The cross-language tests need an Rscript with the installed mizu
      # package (their fixture probe-skips otherwise); Linux legs only.
      # mizu is a private repo, so these steps need the CROSSLANG_PAT
      # secret (a PAT with read access to mizu); without it they skip and
      # the tests probe-skip.
      - name: Set up R (cross-language tests)
        if: runner.os == 'Linux' && env.CROSSLANG_PAT != ''
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # R's startup script (etc/ldpaths) prepends its build-time system
      # library dirs (/usr/local/lib:/usr/lib/x86_64-linux-gnu) to
      # LD_LIBRARY_PATH for every R process and its children, ahead of
      # the toolcache lib dir setup-python exports. ubuntu-26.04 ships a
      # system Python 3.14, so the toolcache's shared-library 3.14
      # interpreter, spawned from an R peer, loaded the system
      # libpython3.14, whose frozen site module is Debian's and looks for
      # dist-packages: no site-packages on sys.path, no pymizu, the R
      # launcher's probe fails. R_LD_LIBRARY_PATH replaces the prepended
      # portion; R's own lib dir is all it needs (the system dirs are on
      # the loader's default search path anyway).
      - name: Keep R's library path off the system dirs (cross-language tests)
        if: runner.os == 'Linux' && env.CROSSLANG_PAT != ''
        run: echo "R_LD_LIBRARY_PATH=$(R RHOME)/lib" >> "$GITHUB_ENV"

      - name: Install the mizu R package (cross-language tests)
        if: runner.os == 'Linux' && env.CROSSLANG_PAT != ''
        env:
          GITHUB_PAT: ${{ secrets.CROSSLANG_PAT }}
        run: |
          install.packages(c("bit64", "pak", "arrow", "nanoarrow"))
          # @async until mizu's async branch lands on main (notify
          # endpoints + handle-first mizu_map)
          pak::pak("shikokuchuo/mizu@async")
        shell: Rscript {0}

      - name: Import smoke
        run: python -c "import pymizu; print(pymizu.__version__, pymizu.__core_version__, pymizu.abi_version())"

      - name: Test
        run: coverage run -m pytest tests/ -q

      - name: Coverage report
        run: |
          coverage combine
          coverage report
          coverage xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # C coverage of the binding's own sources: an instrumented editable
  # build under clang, the test suite (spawned children inherit
  # LLVM_PROFILE_FILE and write their own profraws), an lcov export, and
  # an upload alongside the Python report — Codecov merges per commit.
  c-coverage:
    runs-on: ubuntu-latest
    env:
      CROSSLANG_PAT: ${{ secrets.CROSSLANG_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm reads the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # Editable: the tests (and their spawned children) must load the
      # instrumented .so, and llvm-cov needs its stable source-tree path.
      - name: Instrumented build
        run: |
          CC=clang CFLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            LDFLAGS="-fprofile-instr-generate" \
            pip install -e . pytest numpy pyarrow polars cloudpickle
      # Same cross-language gate as the build legs (they exercise the
      # interop C paths); probe-skips without the secret.
      - name: Set up R (cross-language tests)
        if: env.CROSSLANG_PAT != ''
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install the mizu R package (cross-language tests)
        if: env.CROSSLANG_PAT != ''
        env:
          GITHUB_PAT: ${{ secrets.CROSSLANG_PAT }}
        run: |
          install.packages(c("bit64", "pak", "arrow", "nanoarrow"))
          # @async until mizu's async branch lands on main (notify
          # endpoints + handle-first mizu_map)
          pak::pak("shikokuchuo/mizu@async")
        shell: Rscript {0}
      - name: Test
        # %p keeps each process's profraw distinct; the profile runtime
        # creates no directories.
        run: |
          mkdir -p c-cov
          LLVM_PROFILE_FILE="$PWD/c-cov/pymizu-%p.profraw" python -m pytest tests/ -q
      # The regex drops the vendored core (measured in libmizu's own CI)
      # and CPython's headers (an -I path, so clang emits their inline
      # functions). llvm-cov/llvm-profdata must match the clang that
      # produced the profraw.
      - name: Export lcov
        run: |
          v=$(clang --version | sed -n 's/.*version \([0-9][0-9]*\)\..*/\1/p' | head -1)
          if ! command -v llvm-cov-"$v" >/dev/null; then
            sudo apt-get update && sudo apt-get install -y llvm-"$v"
          fi
          llvm-profdata-"$v" merge -sparse c-cov/*.profraw -o c-cov/merged.profdata
          llvm-cov-"$v" export -format=lcov python/pymizu/_pymizu*.so \
            -instr-profile=c-cov/merged.profdata \
            -ignore-filename-regex='vendor/|include/python' > coverage.lcov
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.lcov
          fail_ci_if_error: false
