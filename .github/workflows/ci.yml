name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tools
        run: pip install ruff pyrefly numpy cloudpickle pyarrow
      - name: Ruff
        run: ruff check python tests benchmarks
      - name: Pyrefly
        run: pyrefly check

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The sdist must carry the vendored C core and build standalone.
      - name: Build sdist and wheel from it
        run: |
          pip install build
          python -m build --sdist
          pip wheel --no-deps dist/*.tar.gz

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # setup.py forces clang-cl on Windows (MSVC C11 atomics unsupported);
      # LLVM is preinstalled on the runners but not on PATH.
      - name: Add LLVM to PATH
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Build and install
        run: pip install . pytest numpy pyarrow coverage

      - name: Import smoke
        run: python -c "import pyrei; print(pyrei.__version__, pyrei.__core_version__, pyrei.abi_version())"

      - name: Test
        run: coverage run -m pytest tests/ -q

      - name: Coverage report
        run: |
          coverage combine
          coverage report
          coverage xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
