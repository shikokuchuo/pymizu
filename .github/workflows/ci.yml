name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm reads the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tools
        # ruff pinned to match the dev extra and .pre-commit-config.yaml —
        # bump all three together.
        run: pip install ruff==0.14.0 pyrefly numpy cloudpickle pyarrow polars
      - name: Ruff
        run: ruff check python tests benchmarks
      - name: Ruff format
        run: ruff format --check python tests benchmarks
      - name: Pyrefly
        run: pyrefly check

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm reads the version from tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The sdist must carry the vendored C core and build standalone.
      - name: Build sdist and wheel from it
        run: |
          pip install build
          python -m build --sdist
          pip wheel --no-deps dist/*.tar.gz

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.14" }
    runs-on: ${{ matrix.os }}
    env:
      CROSSLANG_PAT: ${{ secrets.CROSSLANG_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm reads the version from tags

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # setup.py forces clang-cl on Windows (MSVC C11 atomics unsupported);
      # LLVM is preinstalled on the runners but not on PATH.
      - name: Add LLVM to PATH
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Build and install
        # tzdata: the IANA database zoneinfo falls back to (Windows runners
        # have no system database).
        run: pip install . pytest numpy pyarrow polars cloudpickle coverage tzdata

      # The cross-language tests need an Rscript with the installed mizu
      # package (their fixture probe-skips otherwise); Linux legs only.
      # mizu is a private repo, so these steps need the CROSSLANG_PAT
      # secret (a PAT with read access to mizu); without it they skip and
      # the tests probe-skip.
      - name: Set up R (cross-language tests)
        if: runner.os == 'Linux' && env.CROSSLANG_PAT != ''
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install the mizu R package (cross-language tests)
        if: runner.os == 'Linux' && env.CROSSLANG_PAT != ''
        env:
          GITHUB_PAT: ${{ secrets.CROSSLANG_PAT }}
        run: |
          install.packages(c("bit64", "pak"))
          pak::pak("shikokuchuo/mizu")
        shell: Rscript {0}

      - name: Import smoke
        run: python -c "import pymizu; print(pymizu.__version__, pymizu.__core_version__, pymizu.abi_version())"

      - name: Test
        run: coverage run -m pytest tests/ -q

      - name: Coverage report
        run: |
          coverage combine
          coverage report
          coverage xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
