name: docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install pymizu and the docs toolchain
        # Editable install: the render imports pymizu from the source tree
        # (great-docs puts python/ on PYTHONPATH), so the extension must be
        # built in place. great-docs is unreleased; pinned to a main commit.
        run: |
          pip install -e . numpy cloudpickle jupyter
          pip install "git+https://github.com/posit-dev/great-docs.git@2db0737eed16d4fcdb5d1a6a28a9ca1532a00fa1"

      - name: Build the site
        run: great-docs build

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs/_site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
