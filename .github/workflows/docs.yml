name: docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm reads the version from tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install pymizu and the docs toolchain
        # Editable install: the render imports pymizu from the source tree
        # (great-docs puts python/ on PYTHONPATH), so the extension must be
        # built in place. The docs extra carries great-docs (unreleased,
        # pinned to a main commit in pyproject.toml) plus the render deps.
        run: pip install -e ".[docs]"

      - name: Build the site
        run: great-docs build

      - name: Publish to GitHub Pages
        # Static deploy: docs/ is no longer a Quarto project, so
        # quarto-actions/publish refuses docs/_site.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/_site
