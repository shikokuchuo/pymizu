[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pymizu"
dynamic = ["version"]
description = "Thread-speed async and parallel Python over shared memory"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Charlie Gao", email = "charlie.gao@posit.co" }]
maintainers = [{ name = "Charlie Gao", email = "charlie.gao@posit.co" }]
keywords = [
  "ipc",
  "shared-memory",
  "parallel-computing",
  "zero-copy",
  "task-pool",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: C",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
cloudpickle = ["cloudpickle"]
# Keep the ruff pin in sync with the ruff-pre-commit rev in
# .pre-commit-config.yaml — bump both together.
dev = [
  "pytest>=9",
  "coverage",
  "ruff==0.14.0",
  "pyrefly",
  "build",
  "numpy",
  "cloudpickle",
  "pyarrow",
  "polars",
  "pandas",
  "duckdb",
]
# Docs render deps only. great-docs comes from git main in the docs workflow
# (0.17.0 lacks repo-root config discovery; pin the release here once one has
# it — a direct reference blocks PyPI uploads). Local docs builds:
#   pip install "great-docs @ git+https://github.com/posit-dev/great-docs.git@main"
docs = [
  "numpy",
  "cloudpickle",
  "jupyter",
  "pyarrow",   # Frame.from_arrow's docstring example and guide cell
]
all = ["pymizu[numpy,cloudpickle]"]

[project.urls]
Homepage = "https://shikokuchuo.net/pymizu/"
Repository = "https://github.com/shikokuchuo/pymizu"
Documentation = "https://shikokuchuo.net/pymizu/"
"Bug Tracker" = "https://github.com/shikokuchuo/pymizu/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["pymizu"]

[tool.setuptools.package-data]
pymizu = ["py.typed", "*.pyi"]

[tool.setuptools_scm]

# Release wheels (publish.yml). GIL builds only: free-threaded (cp314t+)
# is out of scope (the GIL policy assumes a GIL), as are PyPy (raw CPython
# C API), 32-bit (64-bit platforms only), and musllinux (untested libc;
# the kernel >= 5.3 requirement narrows its audience anyway).
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
build-verbosity = 1
test-command = "python {project}/tools/smoke_wheel.py"

[tool.cibuildwheel.linux]
# publish.yml's TestPyPI dry run drops setuptools_scm's local version
# segment through this variable; the Linux build runs in a container,
# which sees only the host variables listed here.
environment-pass = ["SETUPTOOLS_SCM_OVERRIDES_FOR_PYMIZU"]

# The parker's __ulock_wait opcode (UL_COMPARE_AND_WAIT_SHARED) needs
# macOS 10.15. cibuildwheel's own default is 10.13 for cp310-cp313 on
# x86_64, which would tag those wheels installable on systems where the
# opcode fails and the park loop spins. Scoped to x86_64: arm64's floor
# is 11.0 already, and a lower value there only draws a bump warning.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
# setup.py forces clang-cl (MSVC C11 atomics unsupported); LLVM is
# preinstalled on the runners (amd64 and arm64 images alike, same path)
# but not on PATH. cibuildwheel evaluates the value as a double-quoted
# bash string, so the backslashes are doubled (a single backslash is
# stripped: C:Program FilesLLVMbin).
environment = { PATH = 'C:\\Program Files\\LLVM\\bin;$PATH' }

[tool.ruff]
target-version = "py310"
line-length = 79
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["python"]
search-path = ["python"]
python-version = "3.10"
# Surface warnings (e.g. deprecated) in output and the exit code.
min-severity = "warn"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--durations=10"]
# The strictness keys written out, not `strict = true`: the umbrella also
# enables options future pytest releases add, and CI installs pytest unpinned.
strict_config = true
strict_markers = true
strict_xfail = true
strict_parametrization_ids = true

[tool.coverage.run]
source = ["pymizu"]
# Unique data file per process: the spawned child/worker interpreters
# measure themselves via COVERAGE_PROCESS_START (see conftest.py).
parallel = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
