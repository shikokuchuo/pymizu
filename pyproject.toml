[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pymizu"
dynamic = ["version"]
description = "Zero-copy shared-memory parallelism across Python and R"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Charlie Gao", email = "charlie.gao@posit.co" }]
maintainers = [{ name = "Charlie Gao", email = "charlie.gao@posit.co" }]
keywords = [
  "ipc",
  "shared-memory",
  "parallel-computing",
  "zero-copy",
  "task-pool",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
cloudpickle = ["cloudpickle"]
# Keep the ruff pin in sync with the ruff-pre-commit rev in
# .pre-commit-config.yaml — bump both together.
dev = [
  "pytest",
  "coverage",
  "ruff==0.14.0",
  "pyrefly",
  "build",
  "numpy",
  "cloudpickle",
  "pyarrow",
  "polars",
]
# great-docs is unreleased: a direct reference pinned to a main commit (the
# docs workflow installs this extra). Direct references block PyPI uploads —
# switch to a version pin once great-docs releases.
docs = [
  "great-docs @ git+https://github.com/posit-dev/great-docs.git@de82be025039c21fc5bff50f2e55747eb254109a",
  "numpy",
  "cloudpickle",
  "jupyter",
  "pyarrow",   # Frame.from_arrow's docstring example and guide cell
]
all = ["pymizu[numpy,cloudpickle]"]

[project.urls]
Homepage = "https://shikokuchuo.net/pymizu/"
Repository = "https://github.com/shikokuchuo/pymizu"
Documentation = "https://shikokuchuo.net/pymizu/"
"Bug Tracker" = "https://github.com/shikokuchuo/pymizu/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["pymizu"]

[tool.setuptools.package-data]
pymizu = ["py.typed", "*.pyi"]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py310"
line-length = 79
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["python"]
search-path = ["python"]
python-version = "3.10"
# Surface warnings (e.g. deprecated) in output and the exit code.
min-severity = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --durations 10 --strict-markers"

[tool.coverage.run]
source = ["pymizu"]
# Unique data file per process: the spawned child/worker interpreters
# measure themselves via COVERAGE_PROCESS_START (see conftest.py).
parallel = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
