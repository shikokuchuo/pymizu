[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pymizu"
version = "0.1.0.dev0"
description = "Lock-free shared-memory channels and task pools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "libmizu authors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]
cloudpickle = ["cloudpickle"]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["pymizu"]

[tool.setuptools.package-data]
pymizu = ["py.typed", "*.pyi"]

[tool.ruff]
target-version = "py310"
line-length = 79
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["python"]
search-path = ["python"]
python-version = "3.10"

[tool.coverage.run]
source = ["pymizu"]
# Unique data file per process: the spawned child/worker interpreters
# measure themselves via COVERAGE_PROCESS_START (see conftest.py).
parallel = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if __name__ == .__main__.:",
]
