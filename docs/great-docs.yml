# Great Docs configuration
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html

display_name: pymizu 水

# Docstrings are NumPy-style (Parameters / Returns / Examples sections)
parser: numpy

site_url: "https://shikokuchuo.net/pymizu/"
repo: https://github.com/shikokuchuo/pymizu
github_style: icon

# Canonical URLs and sitemap (the site is served from a custom domain)
seo:
  canonical:
    base_url: "https://shikokuchuo.net/pymizu/"

dark_mode_toggle: true

# Shrink wide tables to the content width; below 50% scale, scroll instead
# (widest table: the benchmarks comparison table, ~1220px natural, scaling
# to ~0.62 on desktop)
scale_to_fit:
  - "table"
scale_to_fit_min_scale: 0.5

reference:
  sections:
    - title: Channels
      desc: >-
        A two-way message link between a Python process and a helper process
        that it spawns.
      contents:
        - Channel
    - title: Task pools
      desc: >-
        A set of worker processes that divide submitted tasks among
        themselves.
      contents:
        - Pool
        - Task
        - PreparedMap
        - PoolExecutor
    - title: Cross-language interop
      desc: >-
        R peers and workers (the mizu R package), neutral task
        specifications, and the data.frame's Python home.
      contents:
        - call
        - r_launcher
        - r_pool_launcher
        - Frame
    - title: Outcomes and errors
      desc: >-
        Terminal transport states return as the sentinel singletons FULL /
        TIMEOUT / CLOSED / PEER_GONE (identity-tested, never raised); real
        failures raise from the exception hierarchy.
      contents:
        - Sentinel
        - is_sentinel
        - is_remote_error
        - MizuError
        - ShmError
        - StartupError
        - SubmitTimeoutError
        - SlotsExhaustedError
        - StoppedError
        - CancelledError
        - TaskError
        - WorkerDiedError
        - DeclinedError
    - title: Housekeeping
      desc: >-
        The process-wide default pool, the evaluating worker's own pool
        handle, and orphan reaping.
      contents:
        - default_pool
        - set_default_pool
        - using_pool
        - current_pool
        - current_rng
        - prune

# Author metadata (landing page sidebar and citation page)
authors:
  - name: Charlie Gao
    email: charlie.gao@posit.co
    role: Author
    affiliation: Posit Software, PBC
    github: shikokuchuo
    homepage: https://shikokuchuo.net
    orcid: 0000-0002-0750-061X
