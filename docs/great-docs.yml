# Great Docs configuration
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html

display_name: pymizu

# Navbar + favicon use the icon; the full logo (logo.svg / logo-dark.svg)
# is for content surfaces
logo:
  light: assets/logo-icon.svg
  dark: assets/logo-icon.svg

# No hero banner on the landing page (the logo already sits in the content)
hero:
  enabled: false

# Docstrings are NumPy-style (Parameters / Returns / Examples sections)
parser: numpy

site_url: "https://shikokuchuo.net/pymizu/"
repo: https://github.com/shikokuchuo/pymizu
github_style: icon

# The site deploys only from main; without this a render from another branch
# bakes that branch's name into the API source links
source:
  branch: main

# Canonical URLs and sitemap (the site is served from a custom domain)
seo:
  canonical:
    base_url: "https://shikokuchuo.net/pymizu/"

# og:image / twitter card for shared links (1200x630 PNG). A full URL, not a
# local path: great-docs copies a local image to the quarto project root but
# nothing publishes it from there, so the root URL it builds would 404 —
# assets/ is deployed, so point at the deployed path.
social_cards:
  image: https://shikokuchuo.net/pymizu/assets/og-image.png
  twitter_card: summary_large_image

dark_mode_toggle: true

# Shrink wide tables to the content width; below 50% scale, scroll instead
# (widest table: the benchmarks comparison table, ~1220px natural, scaling
# to ~0.62 on desktop)
scale_to_fit:
  - "table"
scale_to_fit_min_scale: 0.5

reference:
  sections:
    - title: Channels
      desc: >-
        A two-way message link between a Python process and a helper process
        that it spawns.
      contents:
        - Channel
    - title: Task pools
      desc: >-
        A set of worker processes that divide submitted tasks among
        themselves.
      contents:
        - Pool
        - Task
        - Map
        - PreparedMap
        - PoolExecutor
    - title: Cross-language interop
      desc: >-
        R peers and workers (the mizu R package), neutral task
        specifications, and the data.frame's Python home.
      contents:
        - call
        - launcher
        - r_launcher
        - Frame
        - DimArray
    - title: Outcomes and errors
      desc: >-
        A full ring, a timeout, a close, or a dead peer returns as a sentinel
        singleton — FULL / TIMEOUT / CLOSED / PEER_GONE — tested by identity,
        never raised. Real failures raise exceptions.
      contents:
        - Sentinel
        - is_sentinel
        - is_remote_error
        - MizuError
        - ShmError
        - StartupError
        - SubmitTimeoutError
        - SlotsExhaustedError
        - StoppedError
        - CancelledError
        - TaskError
        - WorkerDiedError
        - TaskLostError
        - DeclinedError
        - ForeignPayloadError
        - ConcurrentUseError
    - title: Housekeeping
      desc: >-
        The process-wide default pool, the current worker's own pool handle,
        and cleaning up shared memory left by dead processes.
      contents:
        - default_pool
        - set_default_pool
        - using_pool
        - current_pool
        - current_rng
        - prune

# Author metadata (landing page sidebar and citation page)
authors:
  - name: Charlie Gao
    email: charlie.gao@posit.co
    role: Author
    affiliation: Posit Software, PBC
    github: shikokuchuo
    homepage: https://shikokuchuo.net
    orcid: 0000-0002-0750-061X
